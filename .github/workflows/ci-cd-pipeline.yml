name: CI/CD Pipeline - AutoHub Charges API Java (Split Lambda)

# Gatilhos: Rodar em push para main/develop e PRs para main/develop
on:
  push:
    branches:
      - main # ou a branch principal para deploy
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # --- Job de Build e Teste (CI) ---
  build-and-test:
    name: Build & Test Charges API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build and Test with Maven Wrapper
        # Executa build e testes (testes usam @MockBean para AWS/DynamoDB)
        run: ./mvnw clean package

      - name: Find Shaded JAR File for Upload
        id: find_jar_for_upload
        run: |
          # Procura pelo JAR com o classifier '-aws.jar' gerado pelo shade plugin
          JAR_FILE=$(find target -maxdepth 1 -name 'autohub-charges-api-*-SNAPSHOT-aws.jar' | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Shaded JAR file with classifier '-aws.jar' not found in target/!"
            # Fallback sem classifier (caso a config do shade mude)
            JAR_FILE=$(find target -maxdepth 1 -name 'autohub-charges-api-*-SNAPSHOT.jar' -not -name '*-plain.jar' -not -name '*-original.jar' | head -n 1)
            if [ -z "$JAR_FILE" ]; then
               echo "Fallback: Shaded JAR file without classifier not found either!"
               exit 1
            fi
            echo "Warning: Found JAR without '-aws' classifier: $JAR_FILE"
          fi
          echo "Found JAR for upload: $JAR_FILE"
          echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT
          # Não precisamos mais do nome do ficheiro aqui se usarmos S3_DEPLOY_KEY_CHARGES

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: charges-api-jar # Nome do artefacto específico desta API
          path: ${{ steps.find_jar_for_upload.outputs.jar_path }}

  # --- Job de Deploy (CD) ---
  deploy-to-lambda:
    name: Deploy Charges API to AWS Lambda
    runs-on: ubuntu-latest
    needs: build-and-test
    # Trigger no push para a branch 'main' (ajuste se necessário)
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: charges-api-jar # Nome do artefacto
          path: target/ # Descarrega para o diretório target

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Usando Access Keys (ou configure OIDC Role)
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find Shaded JAR File Path
        id: find_jar
        run: |
          # Procura pelo JAR descarregado
          JAR_FILE=$(find target -maxdepth 1 -name 'autohub-charges-api-*-SNAPSHOT-aws.jar' | head -n 1)
           if [ -z "$JAR_FILE" ]; then
             JAR_FILE=$(find target -maxdepth 1 -name 'autohub-charges-api-*-SNAPSHOT.jar' -not -name '*-plain.jar' -not -name '*-original.jar' | head -n 1)
             if [ -z "$JAR_FILE" ]; then
               echo "Shaded JAR file not found in target/ after download!"
               exit 1
             fi
             echo "Warning: Found JAR without '-aws' classifier after download: $JAR_FILE"
           fi
          echo "Found JAR: $JAR_FILE"
          echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT

      - name: Upload JAR to S3
        run: |
          # Usa o secret S3_DEPLOY_KEY_CHARGES para a chave S3
          aws s3 cp ${{ steps.find_jar.outputs.jar_path }} s3://${{ secrets.S3_DEPLOY_BUCKET }}/${{ secrets.S3_DEPLOY_KEY_CHARGES }}
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Update HTTP Lambda Function Code
        run: |
          # Atualiza a Lambda HTTP usando a chave S3 do secret
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME_CHARGES_HTTP }} \
            --s3-bucket ${{ secrets.S3_DEPLOY_BUCKET }} \
            --s3-key ${{ secrets.S3_DEPLOY_KEY_CHARGES }} \
            --publish
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Update SQS Lambda Function Code
        run: |
          # Atualiza a Lambda SQS usando a chave S3 do secret
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME_CHARGES_SQS }} \
            --s3-bucket ${{ secrets.S3_DEPLOY_BUCKET }} \
            --s3-key ${{ secrets.S3_DEPLOY_KEY_CHARGES }} \
            --publish
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

